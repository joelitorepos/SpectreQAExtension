<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 240px;
      background: #f8fafc;
      color: #1e293b;
    }
    .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 24px; height: 24px;
      background: #534AB7;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 13px;
    }
    .app-name { font-size: 13px; font-weight: 600; }
    .body { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .status-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px;
    }
    .status-label { color: #64748b; }
    .status-badge {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 500;
      padding: 2px 8px; border-radius: 20px;
    }
    .badge-connected { background: #f0fdf4; color: #16a34a; }
    .badge-disconnected { background: #f8fafc; color: #94a3b8; }
    .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot-on { background: #22c55e; }
    .dot-off { background: #cbd5e1; }
    .hint {
      font-size: 11px; color: #94a3b8; line-height: 1.5;
      padding: 8px 10px;
      background: #f1f5f9;
      border-radius: 8px;
    }
    .audit-url {
      font-size: 11px; font-family: monospace;
      color: #534AB7; background: #eef2ff;
      padding: 6px 10px; border-radius: 8px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⬡</div>
    <span class="app-name">Auditly</span>
  </div>
  <div class="body">
    <div class="status-row">
      <span class="status-label">App desktop</span>
      <span class="status-badge badge-disconnected" id="conn-badge">
        <span class="dot dot-off" id="conn-dot"></span>
        <span id="conn-text">Sin conectar</span>
      </span>
    </div>
    <div id="audit-info" class="hint" style="display:none"></div>
    <div id="hint" class="hint">
      Abre Auditly para que la extensión se conecte automáticamente.
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
